name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff linter
        run: ruff check custom_components/carris/

      - name: Run Ruff formatter check
        run: ruff format --check custom_components/carris/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy aiohttp homeassistant

      - name: Run MyPy
        run: mypy custom_components/carris/ --ignore-missing-imports

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov aiohttp async-timeout
          pip install homeassistant

      - name: Run tests
        run: |
          pytest tests/ -v --cov=custom_components/carris --cov-report=term-missing

  validate:
    name: Validate Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant voluptuous aiohttp async-timeout

      - name: Validate manifest.json
        run: |
          python -c "
          import json
          with open('custom_components/carris/manifest.json') as f:
              manifest = json.load(f)
          
          required_keys = ['domain', 'name', 'codeowners', 'config_flow', 'documentation', 'iot_class', 'version']
          for key in required_keys:
              assert key in manifest, f'Missing required key: {key}'
          
          assert manifest['codeowners'], 'codeowners must not be empty'
          assert manifest['config_flow'] == True, 'config_flow must be true'
          
          print('✓ manifest.json is valid')
          "

      - name: Validate strings.json
        run: |
          python -c "
          import json
          with open('custom_components/carris/strings.json') as f:
              strings = json.load(f)
          
          assert 'config' in strings, 'Missing config key'
          assert 'options' in strings, 'Missing options key'
          
          print('✓ strings.json is valid')
          "

      - name: Check Python syntax
        run: |
          python -m compileall custom_components/carris/ -q
          echo "✓ All Python files have valid syntax"

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

